[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelclass"
dynamic = ["version"]
description = "A 2D game engine for classroom teaching, built on pygame + pymunk"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kylo94" }]
keywords = ["game", "pygame", "pymunk", "education", "game-engine", "teaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pygame>=2.5.0",
    "pymunk>=6.11.1",
    "pytmx>=3.32",
]

# 两处都写：uv 用 [dependency-groups]（uv run 默认就装），pip 用户用 extras
[project.optional-dependencies]
dev = ["black", "flake8", "mypy", "pytest", "build", "twine"]

[dependency-groups]
dev = ["black", "flake8", "mypy", "pytest", "build", "twine"]

[project.urls]
Repository = "https://github.com/Kylo94/pixelclass"

[tool.setuptools]
include-package-data = true

# 自动发现 src/ 下的所有子包（physics / worldmap / ui 曾经漏掉过，见 0.1.1 修复）
[tool.setuptools.packages.find]
where = ["src"]
include = ["pixelclass*"]

[tool.setuptools.dynamic]
version = { attr = "pixelclass._version.__version__" }

[tool.setuptools.package-data]
pixelclass = ["py.typed", "static/*"]

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
